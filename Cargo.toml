[package]
name = "easytoprint"
version = "0.2.2"
edition = "2021"
description = "Masowy druk PDF - kolejka z drag & drop"

[dependencies]
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
